# docker-compose.yml
#
# Three services:
#   db         Postgres 16, initialized from database/tables.sql +
#              views.sql on first boot (see the `volumes:` mounts under
#              `db` below — docker-entrypoint-initdb.d runs .sql files
#              in filename order, hence the 01_/02_ target names).
#   app        The FastAPI dashboard + JSON API 
#   scheduler  Phase 14's long-running scheduler
#              (src/scheduler/run_scheduler.py) — runs the daily/weekly
#              jobs from src/scheduler/jobs.py on the schedule configured
#              via SCHEDULER_* env vars.
#
# `app` and `scheduler` are built from the same Dockerfile/image — see
# that file's header comment for why — differing only in their
# `command:` below.
#
# Quick start:
#   cp .env.example .env    # then fill in your API keys
#   docker compose up -d --build
#   docker compose logs -f app

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartstock}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mounted directly from the existing Phase 2 files (not copied/
      # duplicated) with explicit ordering prefixes, since
      # docker-entrypoint-initdb.d runs *.sql in filename order and
      # views.sql depends on tables.sql already having run.
      - ./database/tables.sql:/docker-entrypoint-initdb.d/01_tables.sql:ro
      - ./database/views.sql:/docker-entrypoint-initdb.d/02_views.sql:ro
    ports:
      # Exposed on the host so you can psql in / point a local GUI
      # client at it for debugging. Remove this in a production
      # deployment where only the `app`/`scheduler` containers should
      # reach Postgres (see docs/PHASE_14_SETUP_GUIDE.md's AWS section).
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smartstock}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      # Override .env's default (localhost) — inside the Compose
      # network, Postgres is reachable at the service name `db`, not
      # localhost. Every other setting comes from .env unchanged.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "${APP_HOST_PORT:-8000}:8000"
    volumes:
      # Phase 11 RAG: ingested PDFs and the ChromaDB index need to
      # persist across `docker compose down`/rebuilds, not just live
      # inside the container's writable layer.
      - ./data/reports:/app/data/reports
      - ./vector_db:/app/vector_db
      # Phase 8: trained models + metadata, likewise.
      - ./models:/app/models
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python -m src.scheduler.run_scheduler
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - ./data/reports:/app/data/reports
      - ./vector_db:/app/vector_db
      - ./models:/app/models
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
